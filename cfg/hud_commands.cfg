con_timestamp								"0"


alias "console_unlog"						"con_filter_enable 0; con_logfile console.log"


//---------------------------Background Toggle Commands-------------------------------//
alias "menu_bg_clear"				"sixense_clear_bindings; sixense_write_bindings mainmenuoverride_backgrounds.txt"
alias "menu_bg_log"					"con_filter_text #base; con_filter_enable 1; con_logfile cfg/mainmenuoverride_backgrounds.txt"

alias "menu_bg_scout"					"menu_bg_clear; menu_bg_log; echo #base ../custom/WeirdcoreHUD/_customizations/backgrounds/scout.res; console_unlog"
alias "menu_bg_demo"					"menu_bg_clear; menu_bg_log; echo #base ../custom/WeirdcoreHUD/_customizations/backgrounds/demo.res; console_unlog"
alias "menu_bg_spy"					"menu_bg_clear; menu_bg_log; echo #base ../custom/WeirdcoreHUD/_customizations/backgrounds/spy.res; console_unlog"
alias "menu_bg_hudbanner"					"menu_bg_clear; menu_bg_log; echo #base ../custom/WeirdcoreHUD/_customizations/backgrounds/hudbanner.res; console_unlog"
alias "menu_bg_phoxbas"					"menu_bg_clear; menu_bg_log; echo #base ../custom/WeirdcoreHUD/_customizations/backgrounds/phoxbas.res; console_unlog"
alias "menu_bg_salad_blu"					"menu_bg_clear; menu_bg_log; echo #base ../custom/WeirdcoreHUD/_customizations/backgrounds/salad_blu.res; console_unlog"
alias "menu_bg_salad_red"					"menu_bg_clear; menu_bg_log; echo #base ../custom/WeirdcoreHUD/_customizations/backgrounds/salad_red.res; console_unlog"
alias "menu_bg_mrsglitch"					"menu_bg_clear; menu_bg_log; echo #base ../custom/WeirdcoreHUD/_customizations/backgrounds/mrsglitch.res; console_unlog"

// "random" background: cycle through the real backgrounds on each press (was a garbage placeholder)
alias "menu_bg_r1"					"menu_bg_scout;    alias menu_bg_randrom menu_bg_r2"
alias "menu_bg_r2"					"menu_bg_demo;     alias menu_bg_randrom menu_bg_r3"
alias "menu_bg_r3"					"menu_bg_spy;      alias menu_bg_randrom menu_bg_r4"
alias "menu_bg_r4"					"menu_bg_hudbanner; alias menu_bg_randrom menu_bg_r5"
alias "menu_bg_r5"					"menu_bg_phoxbas; alias menu_bg_randrom menu_bg_r6"
alias "menu_bg_r6"					"menu_bg_salad_blu; alias menu_bg_randrom menu_bg_r7"
alias "menu_bg_r7"					"menu_bg_salad_red; alias menu_bg_randrom menu_bg_r8"
alias "menu_bg_r8"					"menu_bg_mrsglitch; alias menu_bg_randrom menu_bg_r1"
alias "menu_bg_randrom"					"menu_bg_r1"